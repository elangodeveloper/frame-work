<section class="forgot-password-screen" aria-labelledby="forgot-password-heading">
  <jarvis-auth-page-header
    [title]="'Reset your password'"
    [subtitle]="'Self-service identity verification and credential recovery.'"
    [badge]="'CREDENTIAL RECOVERY'"
    [icon]="'pi pi-key'">
  </jarvis-auth-page-header>

  <div class="jarvis-alert-banner jarvis-alert-banner--info">
    <i class="pi pi-info-circle" aria-hidden="true"></i>
    <span>Enter your corporate email or employee ID. A secure cryptographic reset link will be dispatched if the account is active.</span>
  </div>

  <form (submit)="handleRequestReset()" novalidate>
    <div class="jarvis-form-group">
      <label class="jarvis-form-label" for="recovery-identifier-input">
        {{ orgConfig.identifierLabel }}
      </label>
      <input
        id="recovery-identifier-input"
        type="text"
        class="p-inputtext p-component"
        [value]="identifier()"
        [class.p-invalid]="identifierError()"
        placeholder="e.g. stark@jarvis.ai"
        autocomplete="email"
        required />
      <div *ngIf="identifierError()" class="jarvis-form-error" role="alert">
        <i class="pi pi-exclamation-circle"></i>
        <span>{{ identifierError() }}</span>
      </div>
    </div>

    <div *ngIf="statusMessage()" class="jarvis-alert-banner jarvis-alert-banner--success" role="status">
      <i class="pi pi-check-circle" aria-hidden="true"></i>
      <span>{{ statusMessage() }}</span>
    </div>

    <button
      type="submit"
      class="p-button p-component w-full submit-button-primary mt-2"
      [disabled]="authService.isLoading()">
      <span *ngIf="authService.isLoading()" class="pi pi-spinner pi-spin"></span>
      <i *ngIf="!authService.isLoading()" class="pi pi-send"></i>
      <span>Dispatch Recovery Link</span>
    </button>

    <button
      type="button"
      class="p-button p-component p-button-text w-full mt-3 text-slate-600"
      (click)="navigateToLogin()">
      <i class="pi pi-arrow-left"></i>
      <span>Back to Sign In</span>
    </button>
  </form>
</section>
