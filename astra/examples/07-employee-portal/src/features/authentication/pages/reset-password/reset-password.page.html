<section class="reset-password-screen" aria-labelledby="reset-heading">
  <jarvis-auth-page-header
    [title]="'Set new password'"
    [subtitle]="'Choose a strong password compliant with corporate security guidelines.'"
    [badge]="'SECURITY CREDENTIALS'"
    [icon]="'pi pi-lock'">
  </jarvis-auth-page-header>

  <form (submit)="handleReset()" novalidate>
    <div class="jarvis-form-group">
      <label class="jarvis-form-label" for="new-password-input">New Password</label>
      <div class="jarvis-password-wrapper">
        <input
          id="new-password-input"
          [type]="showPassword() ? 'text' : 'password'"
          class="p-inputtext p-component"
          [value]="newPassword()"
          placeholder="Enter new password"
          autocomplete="new-password"
          required />
        <button
          type="button"
          class="jarvis-password-toggle"
          (click)="togglePasswordVisibility()"
          aria-label="Toggle password visibility">
          <i [class]="showPassword() ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
          <span>{{ showPassword() ? 'Hide' : 'Show' }}</span>
        </button>
      </div>
    </div>

    <div class="jarvis-form-group">
      <label class="jarvis-form-label" for="confirm-password-input">Confirm New Password</label>
      <input
        id="confirm-password-input"
        type="password"
        class="p-inputtext p-component"
        [value]="confirmPassword()"
        placeholder="Repeat new password"
        autocomplete="new-password"
        required />
    </div>

    <div class="password-policy-box">
      <div class="policy-header">Enterprise Password Policy Checklist:</div>
      <div class="jarvis-policy-rule" [class.jarvis-policy-rule--met]="policyCheck().minLength">
        <i [class]="policyCheck().minLength ? 'pi pi-check text-emerald-600' : 'pi pi-circle text-slate-400'"></i>
        <span>At least 8 characters long</span>
      </div>
      <div class="jarvis-policy-rule" [class.jarvis-policy-rule--met]="policyCheck().hasUppercase">
        <i [class]="policyCheck().hasUppercase ? 'pi pi-check text-emerald-600' : 'pi pi-circle text-slate-400'"></i>
        <span>Contains uppercase letter (A-Z)</span>
      </div>
      <div class="jarvis-policy-rule" [class.jarvis-policy-rule--met]="policyCheck().hasNumber">
        <i [class]="policyCheck().hasNumber ? 'pi pi-check text-emerald-600' : 'pi pi-circle text-slate-400'"></i>
        <span>Contains a number (0-9)</span>
      </div>
      <div class="jarvis-policy-rule" [class.jarvis-policy-rule--met]="policyCheck().hasSpecialChar">
        <i [class]="policyCheck().hasSpecialChar ? 'pi pi-check text-emerald-600' : 'pi pi-circle text-slate-400'"></i>
        <span>Contains special character (!@#$%...)</span>
      </div>
      <div class="jarvis-policy-rule" [class.jarvis-policy-rule--met]="policyCheck().passwordsMatch">
        <i [class]="policyCheck().passwordsMatch ? 'pi pi-check text-emerald-600' : 'pi pi-circle text-slate-400'"></i>
        <span>Passwords match identically</span>
      </div>
    </div>

    <div *ngIf="statusError()" class="jarvis-alert-banner jarvis-alert-banner--danger mt-3" role="status">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ statusError() }}</span>
    </div>
    <div *ngIf="statusSuccess()" class="jarvis-alert-banner jarvis-alert-banner--success mt-3" role="status">
      <i class="pi pi-check-circle"></i>
      <span>{{ statusSuccess() }}</span>
    </div>

    <button
      type="submit"
      class="p-button p-component w-full submit-button-primary mt-4"
      [disabled]="!isPolicySatisfied() || authService.isLoading()">
      <span *ngIf="authService.isLoading()" class="pi pi-spinner pi-spin"></span>
      <i *ngIf="!authService.isLoading()" class="pi pi-lock-open"></i>
      <span>Update Password & Continue</span>
    </button>

    <button
      type="button"
      class="p-button p-component p-button-text w-full mt-3 text-slate-600"
      (click)="navigateToLogin()">
      <span>Proceed to Sign In</span>
    </button>
  </form>
</section>
