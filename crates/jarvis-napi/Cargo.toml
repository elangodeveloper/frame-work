[package]
name = "jarvis-napi"
version = "0.1.0"
edition = "2021"
authors = ["Jarvis Framework Architect Team"]
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi4"] }
napi-derive = "2.16"
jarvis-compiler = { path = "../jarvis-compiler" }

[build-dependencies]
napi-build = "2.1"
