[workspace]
resolver = "2"
members = [
    "crates/jarvis-compiler",
    "crates/jarvis-napi",
    "crates/jarvis-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jarvis Framework Architect Team"]
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
